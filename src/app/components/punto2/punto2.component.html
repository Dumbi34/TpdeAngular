<div class="main-container">
  <div class="new-age-card">
    <h2 class="title text-center mb-4">Conversor de Moneda</h2>
    
    <div class="form-group mb-3">
      <label class="description">Monto en ARS (Pesos):</label>
      <input type="number" [(ngModel)]="monto" (input)="convertir()" class="form-control custom-input" placeholder="Ingrese monto...">
    </div>

    <div class="form-group mb-3">
      <label class="description">Convertir a:</label>
      <select [(ngModel)]="monedaDestino" (change)="convertir()" class="form-select custom-input">
        <option value="USD">Dólar Estadounidense (USD)</option>
        <option value="EUR">Euro (EUR)</option>
        <option value="BRL">Real Brasileño (BRL)</option>
      </select>
    </div>

    <div class="result-box text-center mt-4">
      <span class="description">Resultado:</span>
      <h3 class="result-value">{{ resultado | number:'1.2-2' }} {{ monedaDestino }}</h3>
    </div>
  </div>
</div>
